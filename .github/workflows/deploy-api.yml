name: Deploy API to WSO2 APIM

on:
  push:
    branches:
      - main
    paths:
      - "domains/**"
  workflow_dispatch:
    inputs:
      api_path:
        description: "Path to API folder e.g. domains/finance/orders-api"
        required: true

jobs:
  detect-changed-api:
    name: Detect which API changed
    runs-on: ubuntu-latest
    outputs:
      api_paths: ${{ steps.detect.outputs.api_paths }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed API folders
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api_paths=[\"${{ github.event.inputs.api_path }}\"]" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep '^domains/' \
              | awk -F'/' '{print $1"/"$2"/"$3}' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "api_paths=$CHANGED" >> $GITHUB_OUTPUT
          fi

  deploy-api:
    name: Deploy ${{ matrix.api_path }}
    needs: detect-changed-api
    runs-on: ubuntu-latest
    if: needs.detect-changed-api.outputs.api_paths != '[]'
    strategy:
      matrix:
        api_path: ${{ fromJson(needs.detect-changed-api.outputs.api_paths) }}
      fail-fast: false
    env:
      APICTL_VERSION: "4.7.0"
      APIM_HOST: ${{ secrets.APIM_HOST }}
      APIM_USERNAME: ${{ secrets.APIM_USERNAME }}
      APIM_PASSWORD: ${{ secrets.APIM_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install apictl
        run: |
          curl -sL \
            "https://github.com/wso2/product-apim-tooling/releases/download/v${APICTL_VERSION}/apictl-${APICTL_VERSION}-linux-amd64.tar.gz" \
            -o apictl.tar.gz
          tar -xzf apictl.tar.gz
          chmod +x ./apictl/apictl
          sudo mv ./apictl/apictl /usr/local/bin/apictl
          apictl version

      - name: Merge global template with API config
        run: |
          pip install pyyaml --quiet
          python3 << 'PYEOF'
          import yaml

          global_file = "global/api-template.yaml"
          api_file = "${{ matrix.api_path }}/api.yaml"
          output_file = "${{ matrix.api_path }}/api.yaml.merged"

          with open(global_file) as f:
              global_cfg = yaml.safe_load(f)

          with open(api_file) as f:
              api_cfg = yaml.safe_load(f)

          def deep_merge(base, override):
              result = base.copy()
              for k, v in override.items():
                  if k in result and isinstance(result[k], dict) and isinstance(v, dict):
                      result[k] = deep_merge(result[k], v)
                  else:
                      result[k] = v
              return result

          merged = {
              "type": api_cfg.get("type", global_cfg.get("type")),
              "version": api_cfg.get("version", global_cfg.get("version")),
              "data": deep_merge(global_cfg.get("data", {}), api_cfg.get("data", {}))
          }

          with open(output_file, "w") as f:
              yaml.dump(merged, f, default_flow_style=False, allow_unicode=True)
          PYEOF

          echo "=== MERGED api.yaml CONTENT ==="
          cat "${{ matrix.api_path }}/api.yaml.merged"
          echo "=== END ==="
          mv "${{ matrix.api_path }}/api.yaml.merged" "${{ matrix.api_path }}/api.yaml"

      - name: Add APIM environment
        run: |
          apictl add env dev-local \
            --apim "${APIM_HOST}" \
            --token "${APIM_HOST}/oauth2/token"

      - name: Login to APIM
        run: |
          echo "${APIM_PASSWORD}" | apictl login dev-local \
            -u "${APIM_USERNAME}" \
            --password-stdin \
            -k

      - name: Import API
        run: |
          API_ABS_PATH="${GITHUB_WORKSPACE}/${{ matrix.api_path }}"
          echo "Importing from: ${API_ABS_PATH}"
          apictl import api \
            --file "${API_ABS_PATH}" \
            --environment dev-local \
            --update \
            --preserve-provider \
            -k

      - name: Verify deployment
        run: |
          apictl get apis --environment dev-local -k
